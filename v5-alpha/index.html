<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff1ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="羽球報名 Alpha">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>羽球報名 v5.0.0-alpha.6</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png?v=5-alpha-6">
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=5-alpha-6">
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --blue: #248bf2;
      --green: #23c764;
      --red: #e11d48;
      --orange: #f59e0b;
      --card: rgba(255,255,255,.84);
      --line: rgba(148,163,184,.22);
      --shadow: 0 20px 54px rgba(15,23,42,.13);
      --radius: 28px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body {
      background:
        radial-gradient(circle at 18% 0%, rgba(79,155,255,.28), transparent 28rem),
        radial-gradient(circle at 88% 22%, rgba(35,199,100,.16), transparent 24rem),
        #eaf6ff;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .34;
      background-image:
        linear-gradient(30deg, transparent 0 38px, rgba(54,124,180,.2) 39px 41px, transparent 42px 86px),
        radial-gradient(circle at 22px 22px, rgba(54,124,180,.22) 0 2px, transparent 3px);
      background-size: 110px 110px;
    }
    .app {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 10px calc(28px + env(safe-area-inset-bottom));
    }
    .hero {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 92px;
      padding: 16px;
      border-radius: 26px;
      color: white;
      background: linear-gradient(135deg, #65b6ff, #2d80f6);
      box-shadow: 0 18px 42px rgba(37,99,235,.26);
      animation: rise .42s ease-out both;
    }
    .hero img { width: 56px; height: 56px; border-radius: 17px; background: white; }
    .hero h1 { margin: 0; font-size: clamp(28px, 7vw, 38px); line-height: 1; font-weight: 1000; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero .version { flex: 0 0 auto; padding: 7px 10px; border-radius: 999px; background: rgba(255,255,255,.2); font-size: 13px; font-weight: 1000; }
    .panel {
      margin-top: 12px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      animation: rise .48s ease-out both;
    }
    .kicker { margin: 0 0 2px; color: #8a97a8; font-size: 13px; font-weight: 1000; letter-spacing: .38em; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: clamp(32px, 8vw, 42px); line-height: 1.04; font-weight: 1000; letter-spacing: 0; }
    .icon-button, .small-button {
      border: 0;
      border-radius: 18px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 12px 28px rgba(15,23,42,.1);
      color: var(--blue);
      font-weight: 1000;
    }
    .icon-button { width: 58px; height: 58px; font-size: 25px; }
    .button-row { display: grid; grid-template-columns: minmax(0, 1fr) 58px; gap: 10px; }
    .roster-refresh {
      width: 100%;
      min-height: 58px;
      border-radius: 18px;
      background: linear-gradient(180deg, #35a7ff, #1677e8);
      color: white;
      font-size: 21px;
      box-shadow: 0 14px 28px rgba(10,132,255,.2);
    }
    .primary {
      min-height: 72px;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(180deg, #32d873, #18be56);
      color: white;
      font-size: clamp(25px, 6vw, 33px);
      font-weight: 1000;
      box-shadow: 0 18px 36px rgba(24,190,86,.26);
    }
    button { cursor: pointer; transition: transform .14s ease, filter .14s ease; }
    button:active { transform: scale(.985); filter: brightness(.98); }
    .event-card {
      margin-top: 14px;
      padding: 20px;
      border-radius: 26px;
      background: rgba(255,255,255,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
    .event-name { font-size: clamp(32px, 8vw, 46px); line-height: 1.08; font-weight: 1000; letter-spacing: 0; }
    .info-list { display: grid; gap: 10px; margin-top: 16px; }
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f7f9fc;
      font-size: 20px;
      font-weight: 950;
      color: #475569;
    }
    .info-row strong { color: #2563c7; font-size: 23px; }
    .fee-row { background: linear-gradient(135deg, #fff7ed, #ffedd5); color: #9a3412; }
    .fee-row strong { color: #9a3412; font-size: 28px; }
    .note-row { background: linear-gradient(135deg, #fff7ed, #ffedd5); color: #9a3412; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat {
      min-height: 82px;
      padding: 10px 8px;
      border-radius: 18px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 10px 24px rgba(15,23,42,.08);
      text-align: center;
    }
    .stat .num { display: block; font-size: 36px; line-height: .95; font-weight: 1000; }
    .stat .label { display: block; margin-top: 6px; font-size: 16px; font-weight: 1000; color: #334155; }
    .stat.confirmed .num { color: #2563eb; }
    .stat.remain .num { color: var(--red); }
    .stat.wait .num { color: #d97706; }
    .status-strip { margin-top: 10px; padding: 12px 14px; border-radius: 17px; background: rgba(255,255,255,.9); color: #17437a; font-size: 19px; line-height: 1.35; font-weight: 950; }
    .marquee-strip {
      display: none;
      position: relative;
      min-height: 50px;
      margin-top: 12px;
      overflow: hidden;
      border: 1px solid rgba(37,99,235,.16);
      border-radius: 17px;
      background: linear-gradient(135deg, #eff6ff, #dff1ff);
      color: #1d4ed8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    .marquee-strip.show { display: block; }
    .marquee-text {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      font-size: 20px;
      line-height: 1;
      font-weight: 1000;
      animation: marqueeMove 10s linear infinite;
    }
    .sync-line { margin-top: 8px; color: #64748b; font-size: 14px; line-height: 1.35; font-weight: 900; text-align: right; }
    .signup-card { display: grid; gap: 10px; margin-top: 12px; }
    .signup-card label { display: grid; gap: 6px; color: #475569; font-size: 15px; font-weight: 950; }
    .signup-card input { width: 100%; min-height: 56px; border: 1px solid rgba(148,163,184,.28); border-radius: 18px; background: rgba(255,255,255,.95); padding: 0 16px; color: #0f172a; font-size: 22px; font-weight: 950; outline: none; box-sizing: border-box; }
    .signup-card input:focus { border-color: rgba(30,128,255,.7); box-shadow: 0 0 0 4px rgba(30,128,255,.12); }
    .signup-note { margin: 0; color: #9a3412; font-size: 14px; line-height: 1.45; font-weight: 900; }
    .signup-button { min-height: 62px; border: 0; border-radius: 22px; background: linear-gradient(180deg, #36d66f, #12b95a); color: white; box-shadow: 0 18px 34px rgba(34,197,94,.24); font-size: 24px; font-weight: 1000; }
    .signup-button:disabled { opacity: .55; box-shadow: none; }
    .section-list { display: grid; gap: 10px; }
    details.roster {
      border-radius: 22px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 10px 24px rgba(15,23,42,.08);
      overflow: hidden;
    }
    details.roster summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      padding: 14px 16px;
      font-size: 24px;
      font-weight: 1000;
    }
    details.roster summary::-webkit-details-marker { display: none; }
    .count-pill { min-width: 52px; padding: 6px 12px; border-radius: 999px; background: #e8f2ff; color: #1479d8; text-align: center; }
    .players { display: grid; gap: 8px; padding: 0 12px 14px; }
    .player { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px; padding: 10px 12px; border-radius: 16px; background: white; font-size: 22px; font-weight: 950; }
    .player-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .player-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .order { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: #e8f2ff; color: #1479d8; font-weight: 1000; }
    .cancel-temp {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 14px;
      border: 0;
      border-radius: 14px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 16px;
      font-weight: 1000;
      box-shadow: 0 8px 18px rgba(185,28,28,.12);
    }
    .cancel-temp:disabled { opacity: .55; }
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(15,23,42,.28);
      backdrop-filter: blur(7px);
    }
    .sheet.show { display: block; }
    .sheet-card {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: min(100%, 560px);
      max-height: 76dvh;
      margin: 0 auto;
      padding: 12px 14px calc(18px + env(safe-area-inset-bottom));
      border-radius: 28px 28px 0 0;
      background: rgba(248,251,255,.96);
      box-shadow: 0 -24px 60px rgba(15,23,42,.2);
      overflow: auto;
    }
    .sheet-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0 12px; background: rgba(248,251,255,.96); }
    .sheet-head h3 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 1000; }
    .event-option {
      width: 100%;
      min-height: 112px;
      margin-bottom: 10px;
      padding: 16px;
      border: 2px solid rgba(148,163,184,.26);
      border-radius: 22px;
      background: white;
      text-align: left;
    }
    .event-option.active { border-color: #2563eb; background: #eff6ff; }
    .event-option-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .event-option-name { min-width: 0; font-size: 32px; line-height: 1.08; font-weight: 1000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-option-meta { margin-top: 8px; color: #334155; font-size: 18px; line-height: 1.2; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-option-extra { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #9a3412; font-size: 16px; line-height: 1.15; font-weight: 950; }
    .pill { flex: 0 0 auto; padding: 7px 10px; border-radius: 999px; font-size: 14px; line-height: 1; font-weight: 1000; white-space: nowrap; }
    .pill.need { background: #fee2e2; color: #b91c1c; }
    .pill.full { background: #dbeafe; color: #1d4ed8; }
    .pill.wait { background: #ffedd5; color: #c2410c; }
    .action-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(226, 240, 250, .58);
      backdrop-filter: blur(16px) saturate(1.08);
    }
    .action-modal.show { display: flex; }
    .action-card {
      width: min(100%, 430px);
      padding: 32px 24px 24px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 30px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 28px 76px rgba(15,23,42,.22);
      text-align: center;
    }
    .rally-animation {
      position: relative;
      width: 220px;
      height: 92px;
      margin: 0 auto 14px;
    }
    .racket {
      position: absolute;
      top: 26px;
      width: 58px;
      height: 58px;
      border: 5px solid #93c5fd;
      border-radius: 50%;
      background:
        linear-gradient(45deg, transparent 46%, rgba(96,165,250,.42) 48% 52%, transparent 54%),
        linear-gradient(-45deg, transparent 46%, rgba(96,165,250,.42) 48% 52%, transparent 54%),
        rgba(239,246,255,.78);
      box-shadow: inset 0 0 0 8px rgba(255,255,255,.64);
    }
    .racket::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 34px;
      left: 50%;
      bottom: -31px;
      border-radius: 999px;
      background: #94a3b8;
      transform-origin: top center;
    }
    .racket.left { left: 8px; transform: rotate(-22deg); animation: leftRacket 1.15s ease-in-out infinite; }
    .racket.left::after { transform: translateX(-50%) rotate(-25deg); }
    .racket.right { right: 8px; transform: rotate(22deg); animation: rightRacket 1.15s ease-in-out infinite; }
    .racket.right::after { transform: translateX(-50%) rotate(25deg); }
    .shuttle {
      position: absolute;
      left: 92px;
      top: 36px;
      width: 34px;
      height: 28px;
      animation: shuttleRally 1.15s ease-in-out infinite;
    }
    .shuttle::before {
      content: "";
      position: absolute;
      right: 0;
      top: 9px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
    }
    .shuttle::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 24px;
      height: 28px;
      clip-path: polygon(0 0, 100% 45%, 0 100%);
      background: repeating-linear-gradient(90deg, #bae6fd 0 3px, #eff6ff 3px 7px);
      border-radius: 8px;
    }
    .action-title {
      margin: 0;
      color: #0f172a;
      font-size: clamp(34px, 8vw, 44px);
      line-height: 1.05;
      font-weight: 1000;
    }
    .action-message {
      margin: 14px 0 0;
      color: #475569;
      font-size: 20px;
      line-height: 1.42;
      font-weight: 900;
    }
    .action-confirm {
      display: none;
      width: 100%;
      min-height: 66px;
      margin-top: 24px;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(180deg, #36d66f, #12b95a);
      color: white;
      box-shadow: 0 18px 34px rgba(34,197,94,.24);
      font-size: 26px;
      font-weight: 1000;
    }
    .action-modal.done .action-confirm,
    .action-modal.error .action-confirm { display: block; }
    .action-modal.done .rally-animation,
    .action-modal.error .rally-animation { animation: modalPop .3s ease-out both; }
    .action-modal.error .action-confirm { background: linear-gradient(180deg, #fb7185, #e11d48); }
    .toast { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 30; display: none; max-width: 520px; margin: 0 auto; padding: 13px 15px; border-radius: 17px; background: rgba(255,255,255,.94); box-shadow: 0 18px 46px rgba(15,23,42,.18); font-size: 17px; font-weight: 900; color: #334155; }
    .toast.show { display: block; }
    .skeleton { position: relative; overflow: hidden; color: transparent !important; background: #eaf1f8 !important; }
    .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }
    @keyframes marqueeMove { from { left: 100%; } to { left: -120%; } }
    @keyframes shuttleRally {
      0%, 100% { transform: translateX(-70px) rotate(-10deg); }
      50% { transform: translateX(70px) rotate(10deg); }
    }
    @keyframes leftRacket {
      0%, 100% { transform: rotate(-31deg) translateY(0); }
      50% { transform: rotate(-18deg) translateY(3px); }
    }
    @keyframes rightRacket {
      0%, 100% { transform: rotate(18deg) translateY(3px); }
      50% { transform: rotate(31deg) translateY(0); }
    }
    @keyframes modalPop { from { transform: scale(.96); opacity: .72; } to { transform: scale(1); opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <img src="../icon-180.png?v=5-alpha-6" alt="羽球報名">
      <h1>羽球報名系統</h1>
      <div class="version">v5 alpha.6</div>
    </header>

    <section class="panel">
      <p class="kicker">CURRENT EVENT</p>
      <div class="title-row">
        <h2>目前聚會資訊</h2>
      </div>
      <div class="button-row">
        <button class="primary" id="openPicker" type="button">選擇聚會</button>
        <button class="icon-button" id="quickRefresh" type="button" aria-label="重新整理">🔄</button>
      </div>
      <div class="marquee-strip" id="syncMarquee" aria-live="polite"><div class="marquee-text" id="syncMarqueeText">正在同步最新資料，請稍候...</div></div>
      <article class="event-card">
        <div class="event-name" id="eventName">正在讀取聚會</div>
        <div class="info-list">
          <div class="info-row"><span>日期</span><strong id="eventDate">讀取中</strong></div>
          <div class="info-row"><span>上限</span><strong id="eventMax">-- 人</strong></div>
          <div class="info-row"><span>用球</span><strong id="eventBall">--</strong></div>
          <div class="info-row fee-row"><span>💰 零打費用</span><strong id="eventFee">-- 元</strong></div>
          <div class="info-row note-row" id="eventNoteRow" hidden><span>提醒</span><strong id="eventNote"></strong></div>
        </div>
      </article>
      <div class="stats">
        <div class="stat confirmed"><span class="num" id="confirmedCount">0</span><span class="label">已報</span></div>
        <div class="stat remain"><span class="num" id="remainCount">0</span><span class="label">尚缺</span></div>
        <div class="stat wait"><span class="num" id="waitingCount">0</span><span class="label">候補</span></div>
      </div>
      <div class="status-strip" id="statusText">Alpha 寫入測試：臨打報名會寫入正式資料。</div>
      <div class="sync-line" id="syncTime">資料尚未更新</div>
    </section>

    <section class="panel">
      <p class="kicker">WRITE TEST</p>
      <div class="title-row">
        <h2>臨打報名測試</h2>
      </div>
      <div class="signup-card">
        <label>姓名
          <input id="signupName" autocomplete="name" placeholder="請輸入姓名">
        </label>
        <button class="signup-button" id="submitSignup" type="button">✅ 我要報名</button>
        <p class="signup-note">此測試會寫入正式 Google Sheet。請用真實姓名，避免重複報名。</p>
      </div>
    </section>

    <section class="panel">
      <p class="kicker">READ ONLY</p>
      <div class="title-row">
        <h2>名單預覽</h2>
        <button class="small-button roster-refresh" id="loadRoster" type="button">🔄 重新整理已開啟名單</button>
      </div>
      <div class="section-list">
        <details class="roster" data-section="confirmed" open>
          <summary>正式名單 <span class="count-pill" id="confirmedRosterCount">0</span></summary>
          <div class="players" id="confirmedList"></div>
        </details>
        <details class="roster" data-section="waiting">
          <summary>候補名單 <span class="count-pill" id="waitingRosterCount">0</span></summary>
          <div class="players" id="waitingList"></div>
        </details>
        <details class="roster" data-section="leave">
          <summary>請假名單 <span class="count-pill" id="leaveRosterCount">0</span></summary>
          <div class="players" id="leaveList"></div>
        </details>
      </div>
    </section>
  </div>

  <div class="sheet" id="eventSheet" aria-hidden="true">
    <div class="sheet-card">
      <div class="sheet-head">
        <h3>選擇聚會</h3>
        <button class="icon-button" id="closePicker" type="button" aria-label="關閉">×</button>
      </div>
      <div id="eventOptions"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="action-modal" id="actionModal" aria-hidden="true">
    <div class="action-card" role="dialog" aria-modal="true" aria-labelledby="actionTitle">
      <div class="rally-animation" aria-hidden="true">
        <span class="racket left"></span>
        <span class="shuttle"></span>
        <span class="racket right"></span>
      </div>
      <h3 class="action-title" id="actionTitle">處理中</h3>
      <p class="action-message" id="actionMessage">請稍候，系統正在處理。</p>
      <button class="action-confirm" id="actionConfirm" type="button">確認</button>
    </div>
  </div>

  <script>
    const API_BASE = "https://script.google.com/macros/s/AKfycbw1yQZtGYP1YTAMvvrEZPiP8m6_gCb_-lnCKeKHRGOJ1zuFGK0GHxHouJyoqeci-TLnqQ/exec";
    const SITE = "kangxuan";
    const CACHE_TTL_MS = 30000;
    const state = { events: [], selectedEventId: "", selectedEvent: null, rosterLoaded: false, sections: {} };

    function cacheKey(api, params) {
      return "v5-alpha.6:" + api + ":" + JSON.stringify(params || {});
    }

    function readCache(api, params) {
      try {
        const raw = sessionStorage.getItem(cacheKey(api, params));
        if (!raw) return null;
        const item = JSON.parse(raw);
        if (!item || !item.savedAt || Date.now() - item.savedAt > CACHE_TTL_MS) return null;
        return item.data;
      } catch (err) {
        return null;
      }
    }

    function writeCache(api, params, data) {
      try {
        sessionStorage.setItem(cacheKey(api, params), JSON.stringify({ savedAt: Date.now(), data }));
      } catch (err) {}
    }

    async function apiFetch(api, params = {}, options = {}) {
      if (!options.force) {
        const cached = readCache(api, params);
        if (cached) return Object.assign({}, cached, { fromCache: true });
      }
      const data = await jsonp(api, Object.assign({}, params, { t: Date.now() }));
      writeCache(api, params, data);
      return data;
    }
    async function apiWrite(api, params = {}) {
      const data = await jsonp(api, Object.assign({}, params, { t: Date.now() }));
      clearAlphaCache();
      return data;
    }
    function clearAlphaCache() {
      try {
        Object.keys(sessionStorage).forEach((key) => {
          if (key.indexOf("v5-alpha.") === 0) sessionStorage.removeItem(key);
        });
      } catch (err) {}
    }

    function jsonp(api, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "__v5AlphaCb" + Date.now() + Math.floor(Math.random() * 10000);
        const url = new URL(API_BASE);
        url.searchParams.set("site", SITE);
        url.searchParams.set("api", api);
        url.searchParams.set("callback", cb);
        Object.keys(params).forEach((key) => url.searchParams.set(key, params[key]));
        const script = document.createElement("script");
        const timer = window.setTimeout(() => cleanup(new Error("讀取逾時")), 12000);
        function cleanup(err, data) {
          window.clearTimeout(timer);
          delete window[cb];
          script.remove();
          err ? reject(err) : resolve(data);
        }
        window[cb] = (data) => cleanup(null, data);
        script.onerror = () => cleanup(new Error("讀取失敗"));
        script.src = url.toString();
        document.head.appendChild(script);
      });
    }

    function text(value, fallback = "") { return value == null || value === "" ? fallback : String(value); }
    function escapeHtml(value) {
      return text(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[ch]));
    }
    function parseDate(value) {
      if (!value) return null;
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? null : d;
    }
    function formatDate(value) {
      const d = parseDate(value);
      if (!d) return text(value, "未設定");
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}/${m}/${day}`;
    }
    function weekday(value) {
      const d = parseDate(value);
      return d ? ["週日","週一","週二","週三","週四","週五","週六"][d.getDay()] : "";
    }
    function optionTitle(event) { return text(event.eventName, "未命名聚會"); }
    function meta(event) {
      const group = text(event.groupName, "");
      return [formatDate(event.eventDate), weekday(event.eventDate), group].filter(Boolean).join("｜");
    }
    function eventExtra(event) {
      const fee = Number(event.tempFee) || 0;
      const max = Number(event.maxPeople) || 0;
      return `零打 ${fee}元 · 上限 ${max}人`;
    }
    function pill(event) {
      const remain = Number(event.remainCount) || 0;
      const waiting = Number(event.waitingCount) || 0;
      if (remain > 0) return `<span class="pill need">尚缺 ${remain}人</span>`;
      if (waiting > 0) return `<span class="pill wait">候補 ${waiting}人</span>`;
      return `<span class="pill full">額滿｜可候補</span>`;
    }
    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      window.clearTimeout(toast._timer);
      toast._timer = window.setTimeout(() => el.classList.remove("show"), 2600);
    }
    function showMarquee(message) {
      const strip = document.getElementById("syncMarquee");
      const textEl = document.getElementById("syncMarqueeText");
      if (!strip || !textEl) return;
      textEl.textContent = message || "正在同步最新資料，請稍候...";
      strip.classList.add("show");
    }
    function hideMarquee() {
      const strip = document.getElementById("syncMarquee");
      if (strip) strip.classList.remove("show");
    }
    function showActionModal(stateName, title, message) {
      const modal = document.getElementById("actionModal");
      if (!modal) return;
      modal.classList.remove("done", "error");
      if (stateName) modal.classList.add(stateName);
      document.getElementById("actionTitle").textContent = title || "處理中";
      document.getElementById("actionMessage").textContent = message || "請稍候，系統正在處理。";
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
    }
    function closeActionModal() {
      const modal = document.getElementById("actionModal");
      if (!modal) return;
      modal.classList.remove("show", "done", "error");
      modal.setAttribute("aria-hidden", "true");
    }
    function collapseRosterSections() {
      const placeholders = {
        confirmedList: "點開正式名單才讀取名單",
        waitingList: "點開候補名單才讀取名單",
        leaveList: "點開請假名單才讀取名單"
      };
      document.querySelectorAll("details.roster").forEach((detail) => { detail.open = false; });
      Object.keys(placeholders).forEach((id) => {
        const list = document.getElementById(id);
        if (list) list.innerHTML = `<div class="player"><div class="player-main"><span class="order">-</span><span class="player-name">${placeholders[id]}</span></div></div>`;
      });
      state.sections = {};
    }
    function setBusy(isBusy) {
      document.getElementById("eventName").classList.toggle("skeleton", isBusy);
      document.getElementById("openPicker").disabled = isBusy;
      document.getElementById("quickRefresh").disabled = isBusy;
    }
    function formatSyncTime(value) {
      const d = value ? new Date(value) : new Date();
      if (Number.isNaN(d.getTime())) return "資料已更新";
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      return `資料更新於 ${hh}:${mm}:${ss}`;
    }
    function updateSyncTime(data) {
      const suffix = data && data.fromCache ? "（快取）" : "";
      document.getElementById("syncTime").textContent = formatSyncTime(data && data.generatedAt) + suffix;
    }
    function renderEvent(detail) {
      detail = detail || {};
      const event = detail && detail.event ? detail.event : {};
      state.selectedEvent = detail;
      document.getElementById("eventName").textContent = optionTitle(event);
      document.getElementById("eventDate").textContent = [formatDate(event.eventDate), weekday(event.eventDate)].filter(Boolean).join("｜");
      document.getElementById("eventMax").textContent = `${Number(event.maxPeople) || 0} 人`;
      document.getElementById("eventBall").textContent = text(event.ballType, "MS-101");
      document.getElementById("eventFee").textContent = `${Number(event.tempFee) || 0} 元`;
      document.getElementById("confirmedCount").textContent = Number(detail.confirmedCount) || 0;
      document.getElementById("remainCount").textContent = Number(detail.remainCount) || 0;
      document.getElementById("waitingCount").textContent = Number(detail.waitingCount) || 0;
      const note = text(event.eventNote, "");
      document.getElementById("eventNoteRow").hidden = !note;
      document.getElementById("eventNote").textContent = note;
      document.getElementById("statusText").textContent = detail.partial
        ? "Alpha 寫入測試：摘要已同步正式資料，可測試臨打報名。"
        : "Alpha 寫入測試：名單已同步正式資料，可測試臨打報名。";
      renderRoster(detail);
      renderOptions();
    }
    function mergeSelectedEventSummary(detail) {
      if (!detail || !detail.event || !detail.event.eventId) return;
      const eventId = detail.event.eventId;
      state.events = state.events.map((event) => {
        if (event.eventId !== eventId) return event;
        return Object.assign({}, event, detail.event, {
          confirmedCount: Number(detail.confirmedCount) || 0,
          waitingCount: Number(detail.waitingCount) || 0,
          leaveCount: Number(detail.leaveCount) || 0,
          remainCount: Number(detail.remainCount) || 0
        });
      });
    }
    async function refreshCurrentEvent(options = {}) {
      if (!state.selectedEventId) return;
      const data = await apiFetch("v5EventBasic", { eventId: state.selectedEventId }, { force: true });
      if (!data.ok) throw new Error(data.error || "後端回傳錯誤");
      mergeSelectedEventSummary(data.payload);
      renderEvent(data.payload);
      updateSyncTime(data);
      return data.payload;
    }
    async function refreshOpenRosterSections(preferredSection) {
      const openSections = Array.from(document.querySelectorAll("details.roster[open]")).map((el) => el.dataset.section);
      if (preferredSection && openSections.indexOf(preferredSection) < 0) openSections.unshift(preferredSection);
      const uniqueSections = Array.from(new Set(openSections.filter(Boolean)));
      for (const section of uniqueSections) {
        const target = document.querySelector(`details.roster[data-section="${section}"]`);
        if (target) target.open = true;
        await loadRosterSection(section, { force: true, silent: true });
      }
    }
    async function syncAfterWrite(message, preferredSection) {
      showMarquee(message || "正在更新名單與人數，請稍候...");
      try {
        await refreshCurrentEvent({ force: true });
        await refreshOpenRosterSections(preferredSection);
      } finally {
        hideMarquee();
      }
    }
    async function syncAfterMutationWithoutRoster(message) {
      showMarquee(message || "正在更新聚會人數，請稍候...");
      try {
        await refreshCurrentEvent({ force: true });
        collapseRosterSections();
      } finally {
        hideMarquee();
      }
    }
    function renderOptions() {
      const wrap = document.getElementById("eventOptions");
      wrap.innerHTML = state.events.map((event) => {
        const active = event.eventId === state.selectedEventId ? " active" : "";
        return `<button class="event-option${active}" type="button" data-event-id="${event.eventId}">
          <div class="event-option-main">
            <div class="event-option-name">${optionTitle(event)}</div>
            ${pill(event)}
          </div>
          <div class="event-option-meta">${meta(event)}</div>
          <div class="event-option-extra"><span>${eventExtra(event)}</span><span>${Number(event.confirmedCount) || 0} 已報</span></div>
        </button>`;
      }).join("");
      wrap.querySelectorAll(".event-option").forEach((btn) => {
        btn.addEventListener("click", () => selectEvent(btn.dataset.eventId));
      });
    }
    function renderRoster(detail) {
      const lists = [
        ["confirmed", "confirmedList", "confirmedRosterCount"],
        ["waiting", "waitingList", "waitingRosterCount"],
        ["leave", "leaveList", "leaveRosterCount"]
      ];
      lists.forEach(([key, listId, countId]) => {
        const players = detail && detail[key] ? detail[key] : [];
        document.getElementById(countId).textContent = players.length || Number(detail && detail[key + "Count"]) || 0;
        if (players.length) {
          renderSectionPlayers(key, players);
        } else if (!state.sections[key]) {
          document.getElementById(listId).innerHTML = `<div class="player"><span class="order">-</span><span>點開此區才讀取名單</span></div>`;
        }
      });
    }
    function renderSectionPlayers(section, players) {
      const idMap = { confirmed: "confirmedList", waiting: "waitingList", leave: "leaveList" };
      const list = document.getElementById(idMap[section]);
      if (!list) return;
      list.innerHTML = players && players.length
        ? players.map((p, index) => {
          const signupId = escapeHtml(p.signupId);
          const name = escapeHtml(text(p.name, "未命名"));
          const canCancel = text(p.type) === "temp";
          return `<div class="player">
            <div class="player-main"><span class="order">${Number(p.orderNo) || index + 1}</span><span class="player-name">${name}</span></div>
            ${canCancel ? `<button class="cancel-temp" type="button" data-signup-id="${signupId}" data-name="${name}">取消</button>` : ""}
          </div>`;
        }).join("")
        : `<div class="player"><div class="player-main"><span class="order">-</span><span class="player-name">目前無資料</span></div></div>`;
      state.sections[section] = true;
    }
    async function loadInit(options = {}) {
      setBusy(true);
      try {
        const data = await apiFetch("v5Init", {}, options);
        if (!data.ok) throw new Error(data.error || "後端回傳錯誤");
        state.events = data.payload.events || [];
        state.selectedEventId = data.payload.selectedEventId || (state.events[0] && state.events[0].eventId) || "";
        state.sections = {};
        renderEvent(data.payload.selectedEvent || {
          event: state.events.find((event) => event.eventId === state.selectedEventId) || {},
          confirmedCount: 0,
          waitingCount: 0,
          leaveCount: 0,
          remainCount: 0,
          partial: true
        });
        updateSyncTime(data);
        toast(data.fromCache ? "已使用快取資料" : "已讀取正式資料");
      } catch (err) {
        document.getElementById("eventName").textContent = "讀取失敗";
        document.getElementById("statusText").textContent = err.message || String(err);
        toast("讀取失敗，請稍後再試");
      } finally {
        setBusy(false);
      }
    }
    async function selectEvent(eventId) {
      if (!eventId) return;
      state.selectedEventId = eventId;
      state.sections = {};
      closePicker();
      document.getElementById("eventName").textContent = "正在讀取聚會資料...";
      document.getElementById("statusText").textContent = "正在更新聚會與名單，請稍候";
      ["confirmedCount","remainCount","waitingCount"].forEach((id) => document.getElementById(id).textContent = "...");
      showMarquee("正在讀取聚會資料，請稍候...");
      setBusy(true);
      try {
        const data = await apiFetch("v5EventBasic", { eventId }, { force: true });
        if (!data.ok) throw new Error(data.error || "後端回傳錯誤");
        mergeSelectedEventSummary(data.payload);
        renderEvent(data.payload);
        updateSyncTime(data);
        toast("已切換聚會");
      } catch (err) {
        toast(err.message || "切換失敗");
      } finally {
        setBusy(false);
        hideMarquee();
      }
    }
    async function loadRoster() {
      const openSections = Array.from(document.querySelectorAll("details.roster[open]")).map((el) => el.dataset.section);
      if (!openSections.length) return toast("請先展開要讀取的名單");
      showMarquee("正在重新整理已開啟名單，請稍候...");
      try {
        await refreshCurrentEvent({ force: true });
        for (const section of openSections) {
          await loadRosterSection(section, { force: true, silent: true });
        }
        toast("已更新開啟中的名單");
      } finally {
        hideMarquee();
      }
    }
    async function loadRosterSection(section, options = {}) {
      if (!state.selectedEventId) return toast("請先選擇聚會");
      const idMap = { confirmed: "confirmedList", waiting: "waitingList", leave: "leaveList" };
      const list = document.getElementById(idMap[section]);
      if (list) list.innerHTML = `<div class="player"><span class="order">...</span><span>正在讀取</span></div>`;
      try {
        const data = await apiFetch("v5RosterSection", { eventId: state.selectedEventId, section }, options);
        if (!data.ok) throw new Error(data.error || "後端回傳錯誤");
        document.getElementById("confirmedCount").textContent = Number(data.payload.confirmedCount) || 0;
        document.getElementById("remainCount").textContent = Number(data.payload.remainCount) || 0;
        document.getElementById("waitingCount").textContent = Number(data.payload.waitingCount) || 0;
        document.getElementById("confirmedRosterCount").textContent = Number(data.payload.confirmedCount) || 0;
        document.getElementById("waitingRosterCount").textContent = Number(data.payload.waitingCount) || 0;
        document.getElementById("leaveRosterCount").textContent = Number(data.payload.leaveCount) || 0;
        renderSectionPlayers(section, data.payload.players || []);
        updateSyncTime(data);
      } catch (err) {
        if (list) list.innerHTML = `<div class="player"><span class="order">!</span><span>${text(err.message, "名單讀取失敗")}</span></div>`;
        if (!options.silent) toast(err.message || "名單讀取失敗");
      }
    }
    async function submitSignup() {
      if (!state.selectedEventId) return toast("請先選擇聚會");
      const input = document.getElementById("signupName");
      const button = document.getElementById("submitSignup");
      const name = input.value.trim();
      if (!name) return toast("請輸入姓名");
      button.disabled = true;
      button.textContent = "報名中...";
      showMarquee("正在送出臨打報名，請不要重複點擊...");
      showActionModal("", "報名中", "正在寫入報名資料，請不要重複操作。");
      collapseRosterSections();
      try {
        const data = await apiWrite("v5SignupTemp", { eventId: state.selectedEventId, name, phone: "" });
        if (!data.ok) throw new Error(data.error || "報名失敗");
        input.value = "";
        const status = data.payload && data.payload.signedStatus ? data.payload.signedStatus : "";
        await syncAfterMutationWithoutRoster("報名成功，正在更新聚會人數...");
        showActionModal("done", "報名成功", status ? `已完成報名：${status}。名單已收合，點開名單時會重新讀取。` : "已完成報名。名單已收合，點開名單時會重新讀取。");
      } catch (err) {
        showActionModal("error", "報名失敗", err.message || "報名失敗，請稍後再試。");
      } finally {
        hideMarquee();
        button.disabled = false;
        button.textContent = "✅ 我要報名";
      }
    }
    async function cancelTempSignup(signupId, name, button) {
      if (!state.selectedEventId) return toast("請先選擇聚會");
      if (!signupId) return toast("找不到報名資料");
      const displayName = text(name, "此臨打");
      if (!window.confirm(`確定要取消「${displayName}」的臨打報名嗎？\n取消後候補會自動重排。`)) return;
      button.disabled = true;
      button.textContent = "取消中";
      showMarquee("正在取消臨打報名並重新整理名單...");
      showActionModal("", "取消中", "正在取消臨打報名並更新人數，請不要重複操作。");
      collapseRosterSections();
      try {
        const data = await apiWrite("v5CancelTempSignup", { eventId: state.selectedEventId, signupId });
        if (!data.ok) throw new Error(data.error || "取消失敗");
        await syncAfterMutationWithoutRoster("取消成功，正在更新聚會人數...");
        showActionModal("done", "取消成功", data.payload && data.payload.message ? `${data.payload.message}。名單已收合，點開名單時會重新讀取。` : "已取消報名。名單已收合，點開名單時會重新讀取。");
      } catch (err) {
        showActionModal("error", "取消失敗", err.message || "取消失敗，請稍後再試。");
      } finally {
        hideMarquee();
        button.disabled = false;
        button.textContent = "取消";
      }
    }
    function openPicker() { document.getElementById("eventSheet").classList.add("show"); renderOptions(); }
    function closePicker() { document.getElementById("eventSheet").classList.remove("show"); }
    document.getElementById("openPicker").addEventListener("click", openPicker);
    document.getElementById("closePicker").addEventListener("click", closePicker);
    document.getElementById("eventSheet").addEventListener("click", (e) => { if (e.target.id === "eventSheet") closePicker(); });
    document.getElementById("actionConfirm").addEventListener("click", closeActionModal);
    document.getElementById("quickRefresh").addEventListener("click", async () => {
      showMarquee("正在同步最新聚會資料，請稍候...");
      setBusy(true);
      try {
        await refreshCurrentEvent({ force: true });
        await refreshOpenRosterSections();
        toast("已同步最新資料");
      } catch (err) {
        toast(err.message || "同步失敗");
      } finally {
        setBusy(false);
        hideMarquee();
      }
    });
    document.getElementById("loadRoster").addEventListener("click", loadRoster);
    document.getElementById("submitSignup").addEventListener("click", submitSignup);
    document.addEventListener("click", (event) => {
      const button = event.target.closest(".cancel-temp");
      if (button) cancelTempSignup(button.dataset.signupId, button.dataset.name, button);
    });
    document.querySelectorAll("details.roster").forEach((detail) => {
      detail.addEventListener("toggle", () => {
        const section = detail.dataset.section;
        if (detail.open && section && !state.sections[section]) loadRosterSection(section);
      });
    });
    loadInit().then(() => loadRosterSection("confirmed"));
  </script>
</body>
</html>
